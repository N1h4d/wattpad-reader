<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Okuma Sitem{% endblock %}</title>
<style>
    :root {
        --bg: #171512;
        --panel: #211f1b;
        --panel-2: #2a2722;
        --text: #ece6da;
        --muted: #a89f8f;
        --accent: #e08a3e;
        --accent-hover: #f0a15a;
        --border: #3a362f;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: "Georgia", "Segoe UI", serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
    }
    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 16px 28px;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
    }
    header a.brand {
        color: var(--accent);
        text-decoration: none;
        font-size: 1.25rem;
        font-weight: bold;
        letter-spacing: 0.5px;
    }
    header nav a {
        color: var(--muted);
        text-decoration: none;
        margin-left: 18px;
        font-size: 0.95rem;
    }
    header nav a:hover { color: var(--text); }
    main {
        max-width: 780px;
        margin: 0 auto;
        padding: 32px 20px 100px;
        position: relative;
    }
    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 20px;
    }
    input[type="url"], input[type="text"], input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        font-size: 1rem;
    }
    button, .btn {
        display: inline-block;
        background: var(--accent);
        color: #1a1a1a;
        border: none;
        padding: 11px 22px;
        border-radius: 8px;
        font-weight: bold;
        cursor: pointer;
        font-size: 0.95rem;
        text-decoration: none;
        text-align: center;
    }
    button:hover, .btn:hover { background: var(--accent-hover); }
    .btn-secondary {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
    }
    .btn-secondary:hover { background: var(--panel-2); }
    .messages { list-style: none; padding: 0; margin: 0 0 18px; }
    .messages li {
        padding: 10px 14px;
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 0.92rem;
    }
    .messages .error { background: #4a2323; color: #ffb3b3; }
    .messages .success { background: #234a2b; color: #b3ffc0; }
    .book-list { list-style: none; padding: 0; }
    .book-list li {
        padding: 14px 0;
        border-bottom: 1px solid var(--border);
    }
    .book-list li:last-child { border-bottom: none; }
    .book-list a { color: var(--text); text-decoration: none; font-size: 1.05rem; }
    .book-list a:hover { color: var(--accent); }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .chapter-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 32px;
        gap: 10px;
        flex-wrap: wrap;
    }
    .chapter-nav .spacer { flex: 1; }
    .reading-text {
        font-size: 1.15rem;
        line-height: 1.85;
    }
    .reading-text p {
        margin: 0 0 1.2em;
    }
    .reading-text p:last-child { margin-bottom: 0; }
    /* İşaretlenen paragrafın vurgusu - artık scroll yüzdesi yerine
       doğrudan bu paragrafa gidiliyor, bu yüzden vurgu da tam onun
       üzerinde. */
    .reading-text p.marked-paragraph {
        position: relative;
        background: rgba(224, 138, 62, 0.12);
        border-left: 3px solid var(--accent);
        border-radius: 0 6px 6px 0;
        padding: 6px 12px;
        margin-left: -15px;
        margin-right: -15px;
    }
    .reading-text p.marked-paragraph::before {
        content: "📍";
        position: absolute;
        left: -6px;
        top: -22px;
        font-size: 0.8rem;
    }
    .reading-text p.marked-paragraph.pulse {
        animation: mark-pulse 1.4s ease-in-out 2;
    }
    @keyframes mark-pulse {
        0%, 100% { background: rgba(224, 138, 62, 0.12); }
        50% { background: rgba(224, 138, 62, 0.32); }
    }
    .inline-form {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
    }
    .inline-form input { flex: 1; min-width: 220px; }

    /* --- İşaret koy / işarete git araç çubuğu (masaüstü + mobil) --- */
    .mark-toolbar {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 30;
        display: flex;
        justify-content: center;
        gap: 10px;
        padding: 10px 14px calc(10px + env(safe-area-inset-bottom, 0px));
        background: var(--panel);
        border-top: 1px solid var(--border);
        box-shadow: 0 -4px 14px rgba(0,0,0,0.25);
    }
    .tb-btn {
        flex: 1 1 0;
        max-width: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 12px 16px;
        font-size: 0.9rem;
        font-weight: bold;
        font-family: "Segoe UI", sans-serif;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
    }
    .tb-btn:active { transform: scale(0.97); }
    .tb-mark {
        background: var(--accent);
        color: #1a1a1a;
    }
    .tb-mark:hover { background: var(--accent-hover); }
    .tb-mark:disabled { opacity: 0.6; cursor: default; }
    .tb-goto {
        background: var(--panel-2);
        color: var(--text);
    }
    .tb-goto:hover { background: var(--panel-2); border-color: var(--accent); color: var(--accent-hover); }
    @media (max-width: 480px) {
        .tb-btn span { display: none; }
        .tb-btn { max-width: 64px; padding: 12px; }
    }

    /* --- Bölüm içindeki işaret --- */
    /* İşaretin görsel vurgusu artık .reading-text p.marked-paragraph
       kuralında (yukarıda) tanımlı - ayrı bir çizgi elemanına gerek yok,
       çünkü işaret doğrudan bir paragrafın kendisi. */

    .mark-toast {
        position: fixed;
        left: 50%;
        bottom: 82px;
        transform: translateX(-50%) translateY(10px);
        background: #234a2b;
        color: #b3ffc0;
        font-family: "Segoe UI", sans-serif;
        font-size: 0.85rem;
        font-weight: bold;
        padding: 9px 18px;
        border-radius: 999px;
        z-index: 35;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease, transform 0.25s ease;
        white-space: nowrap;
    }
    .mark-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>
    <a class="brand" href="{% url 'home' %}">📖 Okuma Sitem</a>
    {% if user.is_authenticated %}
    <nav>
        <span class="muted">{{ user.username }}</span>
        <a href="{% url 'logout' %}">Çıkış Yap</a>
    </nav>
    {% endif %}
</header>
<main>
    {% if messages %}
    <ul class="messages">
        {% for message in messages %}
        <li class="{{ message.tags }}">{{ message }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
